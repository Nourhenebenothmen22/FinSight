services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - Relational data, LangGraph checkpoints, audit logs
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_strong_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight} -d ${POSTGRES_DB:-finsight}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Qdrant - Vector search for document chunks (hybrid dense + sparse/BM25)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: finsight-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/config.yaml:ro
    ports:
      - "6333:6333"
      - "6334:6334"  # gRPC
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis 7 - Cache, quotas, rate limits, queues, provider cooldowns
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server /usr/local/etc/redis/redis.conf
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Garage v2 - S3-compatible object storage (AGPLv3, PDFs & generated reports)
  # ---------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.6.0
    container_name: finsight-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_DOCUMENTS:-finsight-documents}
      RUST_LOG: garage=info
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"  # S3 API
      - "3903:3903"  # Admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Garage Init - Idempotently ensures all S3 buckets and key permissions exist
  # ---------------------------------------------------------------------------
  garage-init:
    image: python:3.11-slim
    container_name: finsight-garage-init
    restart: "no"
    command: ["python3", "/init_buckets.py"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_BUCKETS: ${S3_BUCKET_DOCUMENTS:-finsight-documents},${S3_BUCKET_REPORTS:-finsight-reports}
    volumes:
      - ./infra/garage/init_buckets.py:/init_buckets.py:ro
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - finsight-network

  # ---------------------------------------------------------------------------
  # Backend API - FastAPI
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: finsight-api
    env_file:
      - .env
    environment:
      APP_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_HOST: garage
      S3_PORT: 3900
      S3_ADMIN_PORT: 3903
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: "false"
      FRONTEND_URL: http://localhost:3002
      CORS_ORIGINS: '["http://localhost:3002"]'
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Background Worker - ARQ async task worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: finsight-worker
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      APP_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_HOST: garage
      S3_PORT: 3900
      S3_ADMIN_PORT: 3903
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: "false"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, pathlib; assert any(\"arq\" in p.read_text(errors=\"ignore\") for p in pathlib.Path(\"/proc\").glob(\"[0-9]*/cmdline\"))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Frontend - Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: finsight-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://api:8000
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Optional: Ollama (local LLM fallback) - disabled by default
  # Enable with: docker compose --profile ollama up -d
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.1.47
    container_name: finsight-ollama
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsight-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  garage_meta:
  garage_data:
  ollama_data:

networks:
  finsight-network:
    driver: bridge
