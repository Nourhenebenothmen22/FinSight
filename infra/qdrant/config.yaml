# Qdrant Configuration for FinSight
# See: https://qdrant.tech/documentation/configuration/

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  max_request_size_mb: 32
  enable_cors: true
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
  api_key: ""  # Disable API key authentication for local development

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  # Performance tuning for hybrid dense + sparse retrieval
  wal:
    wal_capacity_mb: 32
    wal_flush_interval_ms: 1000
  optimizer:
    deleted_threshold: 0.2
    vacuum_min_vector_number: 1000
    default_segment_number: 2
    max_segment_size_kb: 20000
    memmap_threshold_kb: 50000
    indexing_threshold_kb: 20000
    flush_interval_sec: 5
    max_optimization_threads: 2

cluster:
  enabled: false  # Single node for development

log_level: INFO

# Telemetry (disabled by default)
telemetry_disabled: true